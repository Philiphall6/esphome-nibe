# Merge this package into a working nibegw configuration.
# S2 is a REAL AXC: never acknowledge or emulate its address.
# S3 is also passive here until its physical absence and sensor inputs are verified.
text_sensor:
  - platform: template
    id: ecs_s2_mixing_state
    name: "ECS S2 vanne trois voies"
    icon: mdi:valve
    filters:
      - map:
          - opening -> Ouverture
          - closing -> Fermeture
          - idle -> Veille
          - conflict -> Conflit
          - unknown -> Inconnu
  - platform: template
    id: ecs_s3_mixing_state
    name: "ECS S3 vanne trois voies"
    icon: mdi:valve
    filters:
      - map:
          - opening -> Ouverture
          - closing -> Fermeture
          - idle -> Veille
          - conflict -> Conflit
          - unknown -> Inconnu
  - platform: template
    id: ecs_s2_raw55
    name: "ECS S2 commande brute 55"
    entity_category: diagnostic
  - platform: template
    id: ecs_s2_rawa0
    name: "ECS S2 commande brute A0"
    entity_category: diagnostic
  - platform: template
    id: ecs_s3_raw55
    name: "ECS S3 commande brute 55"
    entity_category: diagnostic
  - platform: template
    id: ecs_s3_rawa0
    name: "ECS S3 commande brute A0"
    entity_category: diagnostic

nibegw:
  ecs:
    - id: ecs_s2_observer
      address: ECS_S2
      observe_only: true
      msg1_raw_sensor: ecs_s2_raw55
      msg2_raw_sensor: ecs_s2_rawa0
      # ECS direction bits supported by real S2 demand-change tests.
      # Pump bit remains a candidate (no observed pump-off transition).
      msg1_pump_request_mask: 0x08
      msg1_valve_request_mask: 0x00
      msg1_mixing_state_sensor: ecs_s2_mixing_state
      msg1_mixing_open_byte: 0
      msg1_mixing_open_mask: 0x04
      msg1_mixing_open_value: 0x04
      msg1_mixing_close_byte: 0
      msg1_mixing_close_mask: 0x02
      msg1_mixing_close_value: 0x02
    - id: ecs_s3_observer
      address: ECS_S3
      observe_only: true
      msg1_raw_sensor: ecs_s3_raw55
      msg2_raw_sensor: ecs_s3_rawa0
      msg1_mixing_state_sensor: ecs_s3_mixing_state
      msg1_mixing_open_byte: 0
      msg1_mixing_open_mask: 0x04
      msg1_mixing_open_value: 0x04
      msg1_mixing_close_byte: 0
      msg1_mixing_close_mask: 0x02
      msg1_mixing_close_value: 0x02
      msg1_pump_request_mask: 0x08
      msg1_valve_request_mask: 0x00
